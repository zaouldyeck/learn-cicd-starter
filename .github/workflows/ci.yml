name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Force Failure
        run: (exit 1)
